[project]
name = "embeddinggemma-lab"
version = "0.1.0"
description = "Local multimodal semantic search and Matryoshka-dimension evaluation with google/embeddinggemma-2"
authors = [
    { name = "mutomasa", email = "mutomasa118@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires downloading/running google/embeddinggemma-2"]
